<text x='20' y='50' fill='#555'>굵은 선 = 데이터/제어 흐름 · 회색 상자 = 소프트웨어 모듈(cmysim) · 노란 상자 = 파일 · 주황 = 전기 회로(24 V / 접점)</text>
