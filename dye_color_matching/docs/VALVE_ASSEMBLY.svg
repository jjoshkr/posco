<svg xmlns='http://www.w3.org/2000/svg' width='1900' height='1260' viewBox='0 0 1900 1260' font-family='Pretendard, Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif' font-size='12'>
<defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#333'/></marker><pattern id='thr' width='4' height='8' patternUnits='userSpaceOnUse'><path d='M0,0 L4,4 L0,8' fill='none' stroke='#555' stroke-width='1'/></pattern></defs>
<rect width='1900' height='1260' fill='#fff'/>
<text x='20' y='30' font-size='20' font-weight='700'>솔레노이드 밸브 1개를 패널 라인 출구에 붙이는 법 — 분해 조립도 (피팅 · 튜브 · 밸브가 맞물리는 모양)</text>
<text x='20' y='50' fill='#555'>원리 두 가지만 알면 됩니다. ① 튜브는 '압착 피팅'(너트+페룰)으로 잡는다. ② 나사 구멍에는 '수나사 피팅'을 테프론 테이프 감아 돌려 넣는다. 밸브는 양쪽이 나사 구멍이므로, 양쪽에 '나사 ↔ 튜브' 변환 피팅이 하나씩 필요합니다.</text>
<line x1='40' y1='250' x2='1860' y2='250' stroke='#aaa' stroke-dasharray='8,6'/>
<text x='1865' y='254' font-size='10' fill='#888'>중심선</text>
<text x='20' y='95' font-weight='700' font-size='14'>A. 분해 상태 (왼쪽 = 패널 쪽, 오른쪽 = 반응기 쪽). 모든 부품의 구멍 중심을 한 선에 맞추면 그대로 조립됩니다.</text>
