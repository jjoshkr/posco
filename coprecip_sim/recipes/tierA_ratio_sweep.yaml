# Tier A 혼합 실험: 세 염료를 비율로 동시에 넣고 rpm 과 C 비율을 바꿔 가며 색을 기록 (matrix → 실행 묶음)
name: tierA_ratio
description: 같은 총량(60 mL)을 비율만 바꿔 넣는다. 목표색은 기준 비율(3:1:2)의 색.
reactor: {heel_mL: 2000, rpm: 300}
target: {cmy: [14.56, 4.85, 9.71]}      # 60 mL(30/10/20 mL, 1 g/L) 를 2 L heel 에 넣었을 때의 농도 = 30 g / 2.06 L
match: {de: 1.5}
steps:
  - {step: stir, rpm: 300}
  - {step: wait, seconds: 5}
  - {step: dose, pumps: [P-101, P-102, P-103], ratio: [3, 1, 2], total_mL: 60, minutes: 1.5}
  - {step: settle, factor: 3}
  - {step: measure, seconds: 2, label: mixed}
  - {step: hold, seconds: 20, label: final}
  - {step: stop}
matrix:
  "reactor.rpm": [150, 300, 500]
  "steps[2].ratio": [[3, 1, 2], [3.3, 1, 2], [2.7, 1, 2]]
