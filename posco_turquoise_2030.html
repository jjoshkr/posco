<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2030 POSCO 청록수소 플랜트</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,24,44,.28);z-index:3}
#start.hide{display:none}
#play{font:700 46px "Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:22px 60px;border:0;border-radius:999px;background:#004490;color:#fff;cursor:pointer;box-shadow:0 12px 40px rgba(0,40,90,.35);transition:transform .15s}
#play:hover{transform:scale(1.04)}
#prog{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.25);z-index:2;cursor:pointer;transition:opacity .5s}
#prog.idle{opacity:0}
#fill{height:100%;width:0;background:#1BA39C}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="start"><button id="play">▶ 재생</button></div>
<div id="prog"><div id="fill"></div></div>
<script>
'use strict';
/* =========================================================
   1. CONFIG / CONSTANTS
   ========================================================= */
const W = 1920, H = 1080, DUR = 80.0;
const C = {
  sky1:'#8FD3FF', sky2:'#E9F7FF', pb:'#004490', pb2:'#5B7FB5', tq:'#1BA39C',
  red:'#C0392B', heat:'#E8772E', green:'#2E9E6A', white:'#F7FAFC', ink:'#16202B',
  yellow:'#F2B705', steel:'#C9D3DE', steelD:'#8C9BAD'
};
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const font = (w, s) => `${w} ${s}px ${FONT}`;
const GROUND = 820;            // world ground line
const WORLD_L = -300, WORLD_R = 4950;

// Hazard stops: times, camera framing, marker anchor, card text (exact Korean copy)
const STOPS = [
  { n:1, s:14, e:21, title:'① 원료 인입·전처리', cam:{x:940, y:690, z:1.6}, mk:[640,600],
    risk:'메탄 누출 · 질식', safe:'가스검지기 · 환기 · 자동 차단밸브',
    laws:['도시가스사업법','산업안전보건법 PSM'] },
  { n:2, s:21, e:29, title:'② 열분해 반응기', cam:{x:1610, y:590, z:1.3}, mk:[1190,450],
    risk:'초고온 · 정전 시 미반응 메탄·수소 역류', safe:'비상 인터록 · 역류 방지 · 온도 다중 감시',
    laws:['고압가스 안전관리법 제조허가','산안법 PSM','전기안전관리법'],
    badge:{text:'메탄 열분해 전용 안전기준은 아직 없음', bg:'#FFE08A', fg:'#5A4300'} },
  { n:3, s:29, e:36, title:'③ 탄소 분리·저장', cam:{x:2450, y:640, z:1.45}, mk:[2000,500],
    risk:'카본블랙 분진 폭발 · 정전기 착화', safe:'집진·방폭 설비 · 접지 · 분진 농도 감시',
    laws:['산업안전보건기준 규칙(분진)','KCs 방폭','화평법'],
    badge:{text:'청록수소 고유 위험', bg:'#1BA39C', fg:'#ffffff'} },
  { n:4, s:36, e:43, title:'④ 수소 정제·압축·저장', cam:{x:3390, y:650, z:1.25}, mk:[2960,520],
    risk:'고압 · 눈에 잘 안 보이는 수소 불꽃 · 수소취성', safe:'UV/IR 화염검지 · 안전밸브 · 방폭 구역',
    laws:['고압가스법 KGS 검사','산안법 PSM'] },
  { n:5, s:43, e:50, title:'⑤ 배관 이송', cam:{x:3690, y:450, z:0.7}, mk:[3720,640], cardLeft:true,
    risk:'배관 누출', safe:'정기 검사 · 누출 감지',
    laws:['고압가스법 배관 기준'] }
];
const CHIPS = ['통합환경허가','KGS 완성검사','산안법 PSM 심사','소방·방폭','인허가 로드맵'];

/* =========================================================
   2. TIMELINE HELPERS (tween, ease, sequence)
   ========================================================= */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2,
  out:   k => 1 - Math.pow(1 - k, 3),
  in:    k => k*k*k,
  sine:  k => -(Math.cos(Math.PI * k) - 1) / 2,
  back:  k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(k-1,3) + c1*Math.pow(k-1,2); }
};
const tw = (t, a, b, ease = E.inOut) => ease(prog(t, a, b));
// visibility window with fade-in/out durations -> alpha 0..1
function win(t, a, b, fi = .4, fo = .3) {
  if (t < a || t > b) return 0;
  return Math.min(E.out(prog(t, a, a + fi)), 1 - E.in(prog(t, b - fo, b)));
}
// seeded PRNG (mulberry32) for deterministic particles
function rng(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k, al = 1) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgba(${Math.round(lerp(A[0],B[0],k))},${Math.round(lerp(A[1],B[1],k))},${Math.round(lerp(A[2],B[2],k))},${al})`;
}
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// Camera path: list of segments, each eases from previous pose to `to` over [a,b]
const CAM = (() => {
  const segs = [];
  let cur = { x:1250, y:330, z:0.62 };
  const P0 = { ...cur };
  const add = (a, b, to, ease = E.inOut, dip = 0) => { segs.push({ a, b, from:{...cur}, to:{...to}, ease, dip }); cur = { ...to }; };
  add(0, 6, { x:1400, y:360, z:0.64 }, E.sine);
  add(6, 14, { x:4250, y:390, z:0.64 }, E.sine);
  STOPS.forEach((s, i) => {
    const far = Math.abs(cur.x - s.cam.x) > 1500;
    add(s.s, s.s + 1.1, s.cam, E.inOut, far ? 0.45 : 0.12);
    add(s.s + 1.1, s.e, { x:s.cam.x + 18, y:s.cam.y - 4, z:s.cam.z * 1.035 }, E.sine);
  });
  add(50, 51.2, { x:2330, y:36, z:0.372 }, E.inOut);
  add(51.2, 56, { x:2350, y:40, z:0.376 }, E.sine);
  add(56, 70, { x:2500, y:200, z:0.5 }, E.sine);
  add(70, 71.2, { x:3220, y:300, z:0.56 }, E.inOut);
  add(71.2, 80, { x:3250, y:304, z:0.57 }, E.sine);
  return { segs, P0 };
})();
function camAt(t) {
  let p = { ...CAM.P0 };
  for (const s of CAM.segs) {
    if (t >= s.b) { p = { ...s.to }; continue; }
    if (t < s.a) break;
    const k = s.ease(prog(t, s.a, s.b));
    p = { x:lerp(s.from.x, s.to.x, k), y:lerp(s.from.y, s.to.y, k), z:lerp(s.from.z, s.to.z, k) };
    if (s.dip) p.z *= 1 - s.dip * Math.sin(Math.PI * k);   // zoom-out arc on long moves
    break;
  }
  return p;
}
// world -> screen
const toS = (cam, wx, wy) => [(wx - cam.x) * cam.z + W/2, (wy - cam.y) * cam.z + H/2];

// Flow speed multiplier (stall + reverse during reactor power loss), integrated for deterministic phase
function flowMul(t) {
  if (t < 24.3) return 1;
  if (t < 24.9) return lerp(1, 0, (t - 24.3) / .6);
  if (t < 25.5) return lerp(0, -0.7, (t - 24.9) / .6);
  if (t < 25.7) return lerp(-0.7, 0, (t - 25.5) / .2);   // interlock slams -> stop
  if (t < 28.2) return 0;
  if (t < 29.2) return (t - 28.2);
  return 1;
}
const FLOW = (() => {
  const dt = 0.01, n = Math.ceil(DUR / dt) + 2, a = new Float32Array(n);
  for (let i = 1; i < n; i++) a[i] = a[i-1] + flowMul(i * dt) * dt;
  return t => { const f = clamp(t, 0, DUR) / dt, i = Math.floor(f); return lerp(a[i], a[Math.min(i+1, n-1)], f - i); };
})();

/* =========================================================
   3. WORLD DRAWING — background layers
   ========================================================= */
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}
function lg(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr;
}
// horizontal cylinder shading (metal)
function cyl(g, x, w, tint = '#C9D3DE') {
  return lg(g, x, 0, x + w, 0, [[0, mix(tint,'#7d8da0',.35)], [.32, mix(tint,'#ffffff',.75)], [.6, tint], [1, mix(tint,'#5f6f82',.5)]]);
}

function drawSky(g, t) {
  const k = tw(t, 0, 4.5, E.sine);
  const top = mix('#C9DCEF', C.sky1, k), bot = mix('#FFE6C9', C.sky2, k);
  g.fillStyle = lg(g, 0, 0, 0, H, [[0, top], [1, bot]]);
  g.fillRect(0, 0, W, H);
}
function sunPos(t, cam) {
  const r = tw(t, 0, 5, E.out);
  return [1530 - (cam.x - 1400) * 0.025, lerp(760, 205, r)];
}
function drawSun(g, t, cam) {
  const [sx, sy] = sunPos(t, cam);
  const boost = 1 + 0.35 * tw(t, 70, 76) ;
  // light rays
  g.save(); g.translate(sx, sy); g.rotate(t * 0.04);
  g.globalAlpha = 0.10 * tw(t, 0.8, 4) * boost;
  g.fillStyle = '#FFF4C2';
  for (let i = 0; i < 14; i++) {
    g.rotate(Math.PI * 2 / 14);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(1300, -70); g.lineTo(1300, 70); g.closePath(); g.fill();
  }
  g.restore();
  // glow
  const gr = g.createRadialGradient(sx, sy, 10, sx, sy, 330 * boost);
  gr.addColorStop(0, 'rgba(255,248,214,.95)'); gr.addColorStop(.25, 'rgba(255,236,170,.45)'); gr.addColorStop(1, 'rgba(255,236,170,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(sx, sy, 330 * boost, 0, Math.PI*2); g.fill();
  g.fillStyle = '#FFF6D6'; g.beginPath(); g.arc(sx, sy, 62, 0, Math.PI*2); g.fill();
}
const CLOUDS = (() => { const r = rng(7); return Array.from({length:7}, (_, i) => ({ x: i * 520 + r() * 200, y: 90 + r() * 230, s: .7 + r() * .7, v: 6 + r() * 6 })); })();
function drawClouds(g, t, cam) {
  const span = 3800;
  for (const c of CLOUDS) {
    let x = ((c.x + t * c.v - cam.x * 0.08) % span + span) % span - 500;
    const y = c.y + (cam.y - 400) * -0.03, s = c.s;
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.beginPath();
    [[0,0,60],[55,-25,70],[120,-5,62],[170,8,45],[-50,10,42]].forEach(([dx,dy,r]) => { g.moveTo(x+dx*s+r*s, y+dy*s); g.arc(x+dx*s, y+dy*s, r*s, 0, Math.PI*2); });
    g.fill();
    g.fillStyle = 'rgba(200,225,245,.35)'; g.fillRect(x - 90*s, y + 22*s, 300*s, 6*s);
  }
}
function drawBirds(g, t) {
  if (t > 10) return;
  const r = rng(11);
  for (let i = 0; i < 4; i++) {
    const d = r() * 1.2, x = -100 + (t - d) * (230 + r()*40) + i * 40, y = 330 + i * 26 - (t * 8) + r()*20;
    if (x < -60 || x > W + 60) continue;
    const f = Math.sin(t * 10 + i * 1.7) * 9;
    g.strokeStyle = 'rgba(40,60,85,.75)'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 16, y - f); g.quadraticCurveTo(x - 7, y - 6, x, y); g.quadraticCurveTo(x + 7, y - 6, x + 16, y - f); g.stroke();
  }
}
// parallax layer: x scrolls by factor f, sits on the ground line on screen
function layer(cam, f) {
  const zl = 1 + (cam.z - 1) * f;
  const gy = (GROUND - cam.y) * cam.z + H/2;
  return { zl, gy, X: wx => (wx - cam.x * f) * zl + W/2 - 600 * (1 - f), Y: dy => gy + dy * zl };
}
function hillPath(g, L, x0, x1, base, amp, freq, seed) {
  g.beginPath(); g.moveTo(L.X(x0), L.Y(40));
  for (let x = x0; x <= x1; x += 30) {
    const h = base + amp * (0.55 * Math.sin(x * freq + seed) + 0.3 * Math.sin(x * freq * 2.3 + seed * 2) + 0.15 * Math.sin(x * freq * 5.1));
    g.lineTo(L.X(x), L.Y(-h));
  }
  g.lineTo(L.X(x1), L.Y(40)); g.closePath();
}
function drawBackdrop(g, t, cam) {
  // far hills
  let L = layer(cam, .15);
  g.fillStyle = lg(g, 0, L.Y(-260), 0, L.Y(0), [[0,'#A9C7DD'],[1,'#CFE2EE']]);
  hillPath(g, L, -2400, 9000, 120, 120, 0.0016, 1.3); g.fill();
  // sea (Pohang coast)
  L = layer(cam, .25);
  g.fillStyle = lg(g, 0, L.Y(-60), 0, L.Y(0), [[0,'#5FB4E0'],[1,'#9AD3EE']]);
  g.fillRect(0, L.Y(-58), W, 58 * L.zl + 40);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const x = ((i * 173 + t * 14 - cam.x * .25 * L.zl) % 2100 + 2100) % 2100 - 90, y = L.Y(-44 + (i % 4) * 11);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 40 + (i % 3) * 15, y); g.stroke();
  }
  // near hills (left side and far right, sea visible between)
  L = layer(cam, .45);
  g.fillStyle = lg(g, 0, L.Y(-220), 0, L.Y(0), [[0,'#7FBF8E'],[1,'#A6D6A2']]);
  hillPath(g, L, -3000, 900, 110, 90, 0.0028, .4); g.fill();
  hillPath(g, L, 3800, 9000, 100, 80, 0.0031, 2.2); g.fill();
}
function drawGround(g, t) {
  // in world coords
  g.fillStyle = lg(g, 0, GROUND, 0, GROUND + 500, [[0,'#CFE6C4'],[.25,'#B9DCAD'],[1,'#9CCB90']]);
  g.fillRect(WORLD_L - 4000, GROUND, 14000, 1400);
  // concrete pad
  g.fillStyle = '#E3E9EF'; g.fillRect(WORLD_L + 250, GROUND, 4900, 50);
  g.fillStyle = '#CBD5DF'; g.fillRect(WORLD_L + 250, GROUND + 50, 4900, 6);
  // road
  g.fillStyle = '#7B8794'; g.fillRect(WORLD_L - 4000, GROUND + 70, 14000, 64);
  g.strokeStyle = '#F7FAFC'; g.lineWidth = 4; g.setLineDash([40, 40]);
  g.beginPath(); g.moveTo(WORLD_L - 4000, GROUND + 102); g.lineTo(10000, GROUND + 102); g.stroke(); g.setLineDash([]);
}

/* =========================================================
   4. WORLD DRAWING — plant equipment, people, vehicles
   ========================================================= */
const PIPES = {
  inlet:   [[-300,760],[1250,760]],
  mix:     [[1450,720],[1900,720],[1900,590],[1950,590]],
  h2a:     [[2010,540],[2010,455],[2780,455],[2780,500]],
  h2b:     [[2840,780],[3550,780],[3550,700],[4330,700]],
  carbon:  [[2030,800],[2262,522]],
  recycle: [[2850,560],[2850,400],[1450,400]]
};
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); }
function pipe(g, pts, w = 16) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  poly(g, pts); g.strokeStyle = '#8796A8'; g.lineWidth = w + 4; g.stroke();
  poly(g, pts); g.strokeStyle = '#C9D3DE'; g.lineWidth = w; g.stroke();
  poly(g, pts); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = w * .25; g.stroke();
}
function flow(g, pts, t, color, dash = [20, 26], w = 6, speed = 120) {
  g.save(); poly(g, pts); g.setLineDash(dash); g.lineDashOffset = -FLOW(t) * speed;
  g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); g.restore();
}
function beacon(g, x, y, t, ph = 0) {
  const on = (Math.sin(t * 3.2 + ph) > 0.55) ? 1 : 0.25;
  g.fillStyle = `rgba(255,70,60,${on})`; g.beginPath(); g.arc(x, y, 7, 0, Math.PI*2); g.fill();
  if (on > .5) { g.fillStyle = 'rgba(255,90,70,.25)'; g.beginPath(); g.arc(x, y, 18, 0, Math.PI*2); g.fill(); }
}
function glowOn(g, gl, c = C.tq) { if (gl > 0) { g.shadowColor = rgba(c, .85 * gl); g.shadowBlur = 40 * gl; } }
function glowOff(g) { g.shadowBlur = 0; g.shadowColor = 'transparent'; }

function drawInletAndSkid(g, t, gl) {
  // gas metering station at the fence
  g.fillStyle = '#E6ECF2'; rr(g, 120, 700, 120, 120, 8); g.fill();
  g.fillStyle = C.tq; g.fillRect(120, 712, 120, 10);
  g.fillStyle = '#9FB0C2'; g.fillRect(140, 735, 80, 40);
  // fence
  g.strokeStyle = '#9AA8B8'; g.lineWidth = 3;
  for (let x = -260; x < 100; x += 36) { g.beginPath(); g.moveTo(x, 820); g.lineTo(x, 772); g.stroke(); }
  g.beginPath(); g.moveTo(-270, 780); g.lineTo(100, 780); g.stroke();
  // skid frame
  glowOn(g, gl);
  g.fillStyle = '#5B7FB5'; g.fillRect(520, 800, 300, 20);
  // two horizontal filter vessels
  [[690, 26], [640, 22]].forEach(([cy, r], i) => {
    g.fillStyle = lg(g, 0, cy - r, 0, cy + r, [[0,'#F2F6FA'],[.45,'#D3DCE6'],[1,'#8E9DB0']]);
    rr(g, 555, cy - r, 220, r * 2, r); g.fill();
    g.fillStyle = '#7F8FA3'; g.fillRect(585 + i * 40, cy + r, 10, 800 - cy - r); g.fillRect(735 - i * 30, cy + r, 10, 800 - cy - r);
  });
  glowOff(g);
  // flange on the inlet line (leak point) + valve
  g.fillStyle = '#6E7F93'; g.fillRect(594, 744, 14, 32);
  g.fillStyle = '#6E7F93'; g.fillRect(694, 748, 22, 24);
  // gas detector pole
  g.fillStyle = '#7F8FA3'; g.fillRect(797, 610, 6, 210);
  g.fillStyle = '#F7FAFC'; rr(g, 782, 590, 36, 30, 5); g.fill();
  g.strokeStyle = '#7F8FA3'; g.lineWidth = 2; rr(g, 782, 590, 36, 30, 5); g.stroke();
}
function drawReactor(g, t, gl) {
  // power transformer
  g.fillStyle = '#9FB0C2'; rr(g, 1075, 700, 120, 120, 6); g.fill();
  g.fillStyle = '#B9C6D4'; for (let i = 0; i < 5; i++) g.fillRect(1083 + i * 22, 710, 12, 70);
  g.fillStyle = C.yellow; g.beginPath(); g.moveTo(1140, 788); g.lineTo(1126, 806); g.lineTo(1138, 806); g.lineTo(1130, 820); g.lineTo(1152, 798); g.lineTo(1140, 798); g.closePath(); g.fill();
  g.strokeStyle = '#3E4C5E'; g.lineWidth = 5; g.beginPath(); g.moveTo(1160, 700); g.bezierCurveTo(1170, 620, 1220, 640, 1250, 640); g.stroke();
  // tower
  glowOn(g, gl);
  g.fillStyle = cyl(g, 1250, 200, '#D6DEE7'); g.fillRect(1250, 380, 200, 440);
  g.beginPath(); g.ellipse(1350, 380, 100, 44, 0, Math.PI, 0); g.fill();
  glowOff(g);
  g.fillStyle = 'rgba(0,68,144,.85)'; for (let y = 430; y < 800; y += 90) g.fillRect(1250, y, 200, 6);

function wrapText(g, text, maxW) {
  if (text.includes(' · ')) {           // keep '·'-separated items intact where possible
    const parts = text.split(' · '), out = []; let cur = '';
    for (const p of parts) { const test = cur ? cur + ' · ' + p : p; if (g.measureText(test).width > maxW && cur) { out.push(cur + ' ·'); cur = p; } else cur = test; }
    if (cur) out.push(cur);
    if (out.every(l => g.measureText(l).width <= maxW)) return out;
  }
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}

    add(st.s + .8, .6, tone('sine', 880, .12, .004, .5, .25));
    add(st.s + .8, .3, tone('sine', 1760, .03, .004, .25));
    add(GREEN_AT(st), .7, tone('sine', 1318.5, .09, .005, .4, .3));
    add(GREEN_AT(st) + .12, .9, tone('sine', 1760, .09, .005, .6, .3));
    add(GREEN_AT(st) + .12, .9, tone('triangle', 1760, .025, .005, .4));
  });
  caution(15.6); caution(24.0); caution(31.25); caution(38.6);
  add(16.5, .3, noiseHit('bandpass', 3200, 2, .05, .01, .25, 900));          // valve closes
  add(22.4, 1.6, tone('sine', 70, .08, .5, 1.0, 0, 95));                    // reactor heat rumble
  add(24.0, .7, tone('sine', 420, .07, .01, .6, 0, 70));                    // power-down drop
  add(25.45, .5, tone('sine', 120, .28, .004, .35, .3, 48));                // interlock slam
  add(25.45, .3, noiseHit('lowpass', 900, .7, .12, .002, .18, 200));
  { const r = rng(9); for (let i = 0; i < 7; i++) add(31.2 + r() * .3, .05, noiseHit('highpass', 5000, .7, .05, .001, .03)); }  // spark crackle
  add(31.6, 1.4, o => { const n = A.N(AU.white, true), bp = A.F('bandpass', 400, 1.4), g = A.G(); A.chain(n, bp, g, out(o));
    bp.frequency.setValueAtTime(400, o.at); bp.frequency.exponentialRampToValueAtTime(1800, o.end); A.sus(g, o.at, o.end, .05, .2, .4); play(o, n, o.at, o.end); });  // dust extraction
  add(38.6, .1, tone('sine', 1200, .05, .005, .08)); add(38.78, .1, tone('sine', 1200, .05, .005, .08));  // UV/IR detect beeps
  add(44.2, 5.4, o => { const os = A.O('sawtooth', 180), lp = A.F('lowpass', 800), g = A.G(), trem = A.O('sine', 23), tg = A.G(.006);
    trem.connect(tg); tg.connect(g.gain); A.chain(os, lp, g, out(o)); A.sus(g, o.at, o.end, .016, .6, .8); play(o, os, o.at, o.end); play(o, trem, o.at, o.end); }, true);  // drone
  // --- PERMIT CHIPS: five rising ticks
  CHIPS.forEach((c, i) => { const f = 900 * Math.pow(1.122, i * 2); add(50.9 + i * .55, .2, tone('sine', f, .08, .003, .12, .2)); add(50.9 + i * .55, .2, tone('triangle', f * 2, .02, .003, .08)); });
  // --- CERTIFICATION
  [56.8, 57.0, 57.3].forEach(tt => add(tt, .5, tone('sine', 1567, .03, .01, .4, .3)));   // power icons light up
  [60.3, 61.3, 62.4, 66.2, 68.3].forEach(tt => add(tt, .15, tone('triangle', 1400, .04, .002, .08)));
  add(60.2, .9, tone('sine', 300, .03, .1, .7, 0, 620)); add(62.2, .9, tone('sine', 300, .03, .1, .7, 0, 640));
  add(64.0, .7, noiseHit('bandpass', 600, 1.2, .05, .2, .4, 2400));
  { const r = rng(14); for (let i = 0; i < 6; i++) add(64.6 + i * .08, .1, tone('sine', 2600 + r() * 2200, .025, .003, .07, .4)); }
  add(65.5, .5, tone('sine', 110, .22, .004, .32, .35, 50)); add(65.5, .2, noiseHit('lowpass', 700, .7, .08, .002, .12));
  add(67.0, 1.3, tone('sine', 820, .035, .1, 1.15, .2, 260));              // credit bar drop
  for (let i = 0; i < 12; i++) add(67.05 + i * .1, .06, tone('triangle', 1800 - i * 60, .018, .002, .04));
  // stamp: deep thud + reverb tail, then brass-like chord
  add(68.5, .9, tone('sine', 92, .5, .004, .7, .6, 36));
  add(68.5, .4, noiseHit('lowpass', 260, .7, .25, .002, .3, 90, .5));
  add(68.62, 1.9, o => { const lp = A.F('lowpass', 400, 1.1), g = A.G(); A.chain(lp, g, out(o)); const sg = A.G(.4); g.connect(sg); sg.connect(send(o));
    lp.frequency.setValueAtTime(400, o.at); lp.frequency.exponentialRampToValueAtTime(3400, o.at + .25); lp.frequency.exponentialRampToValueAtTime(1600, o.end);
    A.sus(g, o.at, o.end, 1, .03, 1.0);
    [60, 64, 67, 72, 48].forEach(m => [-8, 8].forEach(dt => { const os = A.O('sawtooth', mtof(m)); os.detune.value = dt; const og = A.G(.022); A.chain(os, og, lp); play(o, os, o.at, o.end); }));
  });
  // --- CELEBRATION: cheer swells, claps, sparkles
  add(70.6, 9.4, o => { const r = rng(42);
    [[1100, .8], [2400, 1.1]].forEach(([f, q], j) => { const n = A.N(AU.pink, true), bp = A.F('bandpass', f, q), g = A.G(); A.chain(n, bp, g, out(o));
      const pts = [[70.6, 0], [71.4, .16]]; for (let tt = 71.6; tt < 79; tt += .3) pts.push([tt, .09 + r() * .12]); pts.push([79.2, .06], [80, 0]);
      A.auto(g.gain, pts, o); play(o, n, o.at, o.end); }); }, true);
  { const r = rng(55); for (let i = 0; i < 44; i++) { const tt = 70.9 + r() * 8.2, lv = .05 + r() * .06, f = 1200 + r() * 900;
      [0, .008, .017].forEach(dt => add(tt + dt, .1, noiseHit('bandpass', f, 1.1, lv, .001, .06))); } }
  { const r = rng(66); for (let i = 0; i < 50; i++) add(70.9 + r() * 8.4, .08, tone('sine', 2600 + r() * 2600, .018, .003, .06, .5)); }
  ev.sort((a, b) => a.t - b.t);
}
// session = one continuous playback run from timeline time T0
function auStart(T0) {
  if (!AU.ac) return; auStop();
  const ac = AU.ac, now = ac.currentTime + .04;
  const s = { T0, base: now - T0, srcs: [], idx: 0 };
  s.bus = ac.createGain(); s.send = ac.createGain(); s.fade = ac.createGain(); s.fade2 = ac.createGain();
  s.bus.connect(s.fade); s.fade.connect(AU.comp); s.send.connect(s.fade2); s.fade2.connect(AU.verb);
  // global fade-out over the last 1.5 s
  [s.fade, s.fade2].forEach(f => { const v0 = T0 < 78.5 ? 1 : clamp(1 - (T0 - 78.5) / 1.5);
    f.gain.setValueAtTime(v0, now); if (T0 < 78.5) f.gain.setValueAtTime(1, s.base + 78.5); f.gain.linearRampToValueAtTime(0, s.base + 80); });
  AU.sess = s;
}
function auStop() {
  const s = AU.sess; if (!s) return; AU.sess = null;
  const t = AU.ac.currentTime;
  [s.fade, s.fade2].forEach(f => { f.gain.cancelScheduledValues(t); f.gain.setValueAtTime(f.gain.value, t); f.gain.linearRampToValueAtTime(0, t + .06); });
  setTimeout(() => { s.srcs.forEach(n => { try { n.stop(); } catch (e) {} }); try { s.fade.disconnect(); s.fade2.disconnect(); } catch (e) {} }, 120);
}
function auTick(tl) {
  const s = AU.sess; if (!s) return;
  const ev = AU.events, horizon = tl + .3;
  while (s.idx < ev.length && ev[s.idx].t <= horizon) {
    const e = ev[s.idx++];
    if (e.t + e.d <= s.T0) continue;                 // already over
    if (e.t < s.T0 - .05 && !e.long) continue;       // short one-shots are skipped when seeking past them
    const at = Math.max(AU.ac.currentTime + .01, s.base + e.t), end = s.base + e.t + e.d;
    if (end - at < .03) continue;
    try { e.f({ s, at, end, off: Math.max(0, s.T0 - e.t) }); } catch (err) { console.warn(err); }
  }
}
function auMute(m) { AU.muted = m; if (AU.master) AU.master.gain.setTargetAtTime(m ? 0 : .85, AU.ac.currentTime, .03); }

/* =========================================================
   11. PLAYER / CONTROLS
   ========================================================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const startEl = document.getElementById('start'), progEl = document.getElementById('prog'), fillEl = document.getElementById('fill');
let dpr = 1, sc = 1, ox = 0, oy = 0;
const P = { playing:false, t:0, startT:0, startClock:0, clock:null };
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  sc = Math.min(innerWidth / W, innerHeight / H); ox = (innerWidth - W * sc) / 2; oy = (innerHeight - H * sc) / 2;
  draw(cur());
}
function cur() { return P.playing ? Math.min(DUR, P.startT + P.clock() - P.startClock) : P.t; }
function vPlay() {
  if (P.t >= DUR) P.t = 0;
  P.clock = (AU.ac && AU.ac.state === 'running') ? () => AU.ac.currentTime : () => performance.now() / 1000;
  P.startClock = P.clock(); P.startT = P.t; P.playing = true; auStart(P.t);
}
function vPause() { P.t = cur(); P.playing = false; auStop(); }
function vSeek(t) { const was = P.playing; if (was) vPause(); P.t = clamp(t, 0, DUR); if (was) vPlay(); else draw(P.t); }
function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(sc, sc);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  renderFrame(ctx, t);
  ctx.restore();
  fillEl.style.width = (t / DUR * 100) + '%';
}
function loop() {
  let t = cur();
  if (P.playing && t >= DUR) { P.t = DUR; P.playing = false; t = DUR; setTimeout(auStop, 200); }   // hold final frame, no loop
  if (P.playing) auTick(t);
  draw(t);
  requestAnimationFrame(loop);
}
setInterval(() => { if (P.playing) auTick(cur()); }, 50);   // keeps audio scheduled if rAF is throttled
async function begin() {
  try { auInit(); await AU.ac.resume(); } catch (e) { console.warn('audio unavailable', e); }
  startEl.classList.add('hide'); P.t = 0; vPlay(); poke();
}
document.getElementById('play').addEventListener('click', begin);
addEventListener('keydown', e => {
  if (!startEl.classList.contains('hide')) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); begin(); } return; }
  switch (e.code) {
    case 'Space': e.preventDefault(); P.playing ? vPause() : vPlay(); break;
    case 'ArrowLeft': vSeek(cur() - 5); break;
    case 'ArrowRight': vSeek(cur() + 5); break;
    case 'KeyM': auMute(!AU.muted); break;
    case 'KeyR': P.t = 0; if (!P.playing) vPlay(); else vSeek(0); break;
    case 'KeyF': if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); break;
    default: return;
  }
  poke();
});
let idleT = null;
function poke() { progEl.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => progEl.classList.add('idle'), 2000); }
addEventListener('mousemove', poke);
progEl.addEventListener('click', e => { if (startEl.classList.contains('hide')) vSeek(e.clientX / innerWidth * DUR); });
addEventListener('resize', resize);

// dev hook: ?t=SECONDS renders that exact moment, paused (screenshot QA)
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null && !isNaN(parseFloat(qt))) { startEl.classList.add('hide'); progEl.classList.add('idle'); P.t = clamp(parseFloat(qt), 0, DUR); }
window.__seek = t => { P.playing = false; P.t = t; draw(t); };
resize();
requestAnimationFrame(loop);
window.__ready = true;
</script>
