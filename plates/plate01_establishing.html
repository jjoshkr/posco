<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장면 01 · 플랜트 전경</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* ============================================================
   PLATE 01 — establishing aerial (3/4 isometric), code-drawn
   ============================================================ */
const W = 1920, H = 1080;
const FONT = '"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const font = (w, s) => `${w} ${s}px ${FONT}`;
const HORIZON = 238;
const PAL = {
  pb:'#004490', pb2:'#5B7FB5', tq:'#1BA39C', tqL:'#5FD0C8', red:'#C0392B', heat:'#E8772E', green:'#2E9E6A',
  ink:'#16202B', steel:'#C7D1DC', steelL:'#EEF3F8', steelD:'#8796A8', concrete:'#E4E8EC', asphalt:'#6D7682'
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, k) {            // k<0 darker, k>0 lighter
  const c = hex(h).map(v => k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${c.map(v => Math.round(v)).join(',')})`;
}
function rgba(h, a) { const c = hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

/* ---------- isometric projection ----------
   world: x -> screen lower-right, y -> screen lower-left, z up (metres-ish) */
const ISO = { s:3.9, ox:900, oy:345 };
const CX = .866, CY = .5;
function P(x, y, z = 0) { return [ISO.ox + (x - y) * CX * ISO.s, ISO.oy + (x + y) * CY * ISO.s - z * ISO.s]; }
const SUN = { dx:-.32, dy:.62 };                       // shadow offset per metre of height (falls to front-left)
function shadowPt(x, y, z) { return [x + SUN.dx * z, y + SUN.dy * z]; }

let g;                                                 // active 2D context
function path(pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function poly3(pts3, fill, stroke, lw = 1) {
  path(pts3.map(p => P(p[0], p[1], p[2] || 0)));
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function line3(a, b, color, lw = 1) { const A = P(...a), B = P(...b); g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.strokeStyle = color; g.lineWidth = lw; g.stroke(); }
function lg(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }

/* ---------- shadows (drawn in one ground pass before objects) ---------- */
const SHADOWS = [];
function shBox(x, y, w, d, h) { SHADOWS.push({ k:'box', x, y, w, d, h }); }
function shCyl(cx, cy, r, h) { SHADOWS.push({ k:'cyl', cx, cy, r, h }); }
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function drawShadows() {
  g.save(); g.fillStyle = 'rgba(28,46,70,.20)';
  for (const s of SHADOWS) {
    let pts = [];
    if (s.k === 'box') {
      const base = [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w, s.y + s.d], [s.x, s.y + s.d]];
      pts = base.concat(base.map(p => shadowPt(p[0], p[1], s.h)));
    } else {
      for (let a = 0; a < 6.283; a += .4) { const px = s.cx + Math.cos(a) * s.r, py = s.cy + Math.sin(a) * s.r; pts.push([px, py], shadowPt(px, py, s.h)); }
    }
    path(hull(pts.map(p => P(p[0], p[1], 0)))); g.fill();
  }
  g.restore();
}

/* ---------- primitives ---------- */
// box with three visible faces; c = base colour, light from upper-right
function box(x, y, z, w, d, h, c, opt = {}) {
  const top = opt.top || shade(c, .28), rt = opt.right || shade(c, .02), lf = opt.left || shade(c, -.2);
  poly3([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], lf);         // +y face (front-left)
  poly3([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], rt);         // +x face (front-right)
  poly3([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], top);        // top
  if (opt.edge !== false) {
    g.strokeStyle = 'rgba(30,45,65,.28)'; g.lineWidth = .8;
    line3([x + w, y + d, z], [x + w, y + d, z + h], 'rgba(255,255,255,.35)', .8);
    line3([x, y + d, z + h], [x + w, y + d, z + h], 'rgba(255,255,255,.5)', .8);
    line3([x + w, y, z + h], [x + w, y + d, z + h], 'rgba(255,255,255,.5)', .8);
  }
}
// windows/louvres on the +y (front-left) face
function faceY(x, y, z, w, h, fn) {      // transform so (u,v) maps along x and up
  const o = P(x, y, z); g.save(); g.setTransform(CX * ISO.s * DPR, CY * ISO.s * DPR, 0, -ISO.s * DPR, o[0] * DPR, o[1] * DPR); fn(); g.restore();
}
function faceX(x, y, z, d, h, fn) {      // along y and up on the +x face
  const o = P(x, y, z); g.save(); g.setTransform(-CX * ISO.s * DPR, CY * ISO.s * DPR, 0, -ISO.s * DPR, o[0] * DPR, o[1] * DPR); fn(); g.restore();
}
function windowsY(x, y, z, w, h, rows, cols, col = 'rgba(40,80,130,.75)', glint = 'rgba(190,225,255,.9)') {
  faceY(x, y, z, w, h, () => {
    const cw = w / cols, rh = h / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      g.fillStyle = col; g.fillRect(c * cw + cw * .18, r * rh + rh * .25, cw * .64, rh * .5);
      g.fillStyle = glint; g.fillRect(c * cw + cw * .18, r * rh + rh * .62, cw * .64, rh * .1);
    }
  });
}
function windowsX(x, y, z, d, h, rows, cols, col = 'rgba(55,95,145,.7)') {
  faceX(x, y, z, d, h, () => {
    const cw = d / cols, rh = h / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { g.fillStyle = col; g.fillRect(-(c + 1) * cw + cw * .18, r * rh + rh * .25, cw * .64, rh * .5); }
  });
}
const ER = 1.2247, ERY = .7071;          // circle -> ellipse factors
function ell(cx, cy, z, r) { const p = P(cx, cy, z); g.beginPath(); g.ellipse(p[0], p[1], r * ER * ISO.s, r * ERY * ISO.s, 0, 0, Math.PI * 2); }
// vertical cylinder (tanks, columns, silos)
function cyl(cx, cy, z, r, h, c, opt = {}) {
  const b = P(cx, cy, z), t = P(cx, cy, z + h), rx = r * ER * ISO.s, ry = r * ERY * ISO.s;
  g.fillStyle = lg(b[0] - rx, 0, b[0] + rx, 0, [[0, shade(c, -.3)], [.35, shade(c, -.08)], [.72, shade(c, .35)], [.9, shade(c, .18)], [1, shade(c, -.05)]]);
  g.beginPath(); g.moveTo(b[0] - rx, b[1]); g.ellipse(b[0], b[1], rx, ry, 0, Math.PI, 0, true); g.lineTo(t[0] + rx, t[1]); g.ellipse(t[0], t[1], rx, ry, 0, 0, Math.PI, true); g.closePath(); g.fill();
  if (opt.bands) opt.bands.forEach(([zz, col, th]) => { const p = P(cx, cy, z + zz); g.strokeStyle = col; g.lineWidth = th * ISO.s; g.beginPath(); g.ellipse(p[0], p[1], rx, ry, 0, 0, Math.PI); g.stroke(); });
  if (opt.cap !== 'none') {
    g.fillStyle = opt.capColor || shade(c, .3); g.beginPath(); g.ellipse(t[0], t[1], rx, ry, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(30,45,65,.25)'; g.lineWidth = .8; g.stroke();
  }
  if (opt.dome) { g.fillStyle = lg(t[0] - rx, 0, t[0] + rx, 0, [[0, shade(c, -.15)], [.7, shade(c, .4)], [1, shade(c, .1)]]); g.beginPath(); g.ellipse(t[0], t[1], rx, opt.dome * ISO.s, 0, Math.PI, 0); g.fill(); }
  if (opt.cone) { const a = P(cx, cy, z + h + opt.cone); g.fillStyle = lg(t[0] - rx, 0, t[0] + rx, 0, [[0, shade(c, -.2)], [.7, shade(c, .38)], [1, shade(c, .05)]]);
    g.beginPath(); g.moveTo(t[0] - rx, t[1]); g.lineTo(a[0], a[1]); g.lineTo(t[0] + rx, t[1]); g.ellipse(t[0], t[1], rx, ry, 0, 0, Math.PI); g.closePath(); g.fill(); }
}
// inverted cone (hopper/cyclone bottom) from z down to z-hc
function cone(cx, cy, z, r, hc, r2, c) {
  const t = P(cx, cy, z), b = P(cx, cy, z - hc), rx = r * ER * ISO.s, ry = r * ERY * ISO.s, rx2 = r2 * ER * ISO.s;
  g.fillStyle = lg(t[0] - rx, 0, t[0] + rx, 0, [[0, shade(c, -.3)], [.7, shade(c, .3)], [1, shade(c, -.05)]]);
  g.beginPath(); g.moveTo(t[0] - rx, t[1]); g.ellipse(t[0], t[1], rx, ry, 0, Math.PI, 0, true); g.lineTo(b[0] + rx2, b[1]); g.lineTo(b[0] - rx2, b[1]); g.closePath(); g.fill();
}
function sphere(cx, cy, z, r, c) {
  const p = P(cx, cy, z), R = r * ISO.s * 1.06;
  const gr = g.createRadialGradient(p[0] + R * .35, p[1] - R * .4, R * .08, p[0], p[1], R);
  gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(.45, shade(c, .2)); gr.addColorStop(1, shade(c, -.35));
  g.fillStyle = gr; g.beginPath(); g.arc(p[0], p[1], R, 0, Math.PI * 2); g.fill();
  g.strokeStyle = rgba(PAL.pb, .35); g.lineWidth = 1.2; g.beginPath(); g.ellipse(p[0], p[1], R, R * .22, 0, 0, Math.PI); g.stroke();
}
// 3D pipe along a polyline
function pipe3(pts, w, c, opt = {}) {
  const sp = pts.map(p => P(...p)); const px = w * ISO.s;
  g.lineJoin = 'round'; g.lineCap = 'round';
  const st = (col, lw) => { g.beginPath(); sp.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = col; g.lineWidth = lw; g.stroke(); };
  st(shade(c, -.35), px + 1.4); st(c, px); st(rgba('#FFFFFF', opt.gloss ?? .55), Math.max(.8, px * .28));
}
// steel structure: columns + beams + grated floors
function frame(x, y, z, w, d, h, levels, c = '#5B7FB5', floor = 'rgba(160,175,195,.9)', part = 'all') {
  const cols = [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
  const lv = []; for (let i = 0; i <= levels; i++) lv.push(z + h * i / levels);
  if (part !== 'beams') lv.forEach((zz, i) => { if (i === 0) return; poly3([[x, y, zz], [x + w, y, zz], [x + w, y + d, zz], [x, y + d, zz]], floor); });
  if (part === 'floors') return;
  cols.forEach(([cx, cy]) => line3([cx, cy, z], [cx, cy, z + h], c, 2.2));
  lv.forEach((zz, i) => { if (i === 0) return;
    line3([x, y + d, zz], [x + w, y + d, zz], c, 2); line3([x + w, y, zz], [x + w, y + d, zz], c, 2);
    // hand-rails
    line3([x, y + d, zz + 1.1], [x + w, y + d, zz + 1.1], rgba('#F2C14E', .9), 1); line3([x + w, y, zz + 1.1], [x + w, y + d, zz + 1.1], rgba('#F2C14E', .9), 1);
  });
  // diagonal bracing on the two visible sides
  for (let i = 0; i < levels; i++) { line3([x, y + d, lv[i]], [x + w, y + d, lv[i + 1]], rgba(c, .6), 1); line3([x + w, y, lv[i]], [x + w, y + d, lv[i + 1]], rgba(c, .6), 1); }
}
function tree(x, y, s = 1, seed = 1) {
  const r = rng(seed)(), p = P(x, y, 0), R = (3 + r * 1.6) * s * ISO.s;
  g.fillStyle = 'rgba(28,46,70,.18)'; g.beginPath(); g.ellipse(p[0] - R * .5, p[1] + R * .35, R * 1.1, R * .45, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#6B4F3A'; g.fillRect(p[0] - 1.2, p[1] - R * .9, 2.4, R * .9);
  const c = P(x, y, 4.2 * s);
  const gr = g.createRadialGradient(c[0] + R * .3, c[1] - R * .4, R * .1, c[0], c[1], R * 1.1);
  gr.addColorStop(0, '#9BD48A'); gr.addColorStop(.6, '#4FA86A'); gr.addColorStop(1, '#2F7F55');
  g.fillStyle = gr; g.beginPath(); g.arc(c[0], c[1], R, 0, Math.PI * 2); g.fill();
}
let DPR = 1;

/* ============================================================
   ENVIRONMENT
   ============================================================ */
function drawSky() {
  g.fillStyle = lg(0, 0, 0, HORIZON, [[0, '#6FC0F2'], [.7, '#BFE5FA'], [1, '#E6F5FD']]); g.fillRect(0, 0, W, HORIZON + 2);
  const sx = 1580, sy = 92;
  const gr = g.createRadialGradient(sx, sy, 8, sx, sy, 420);
  gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(.12, 'rgba(255,240,190,.75)'); gr.addColorStop(.4, 'rgba(255,240,200,.18)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, HORIZON + 2);
  g.fillStyle = '#FFFBEA'; g.beginPath(); g.arc(sx, sy, 34, 0, Math.PI * 2); g.fill();
  // soft clouds
  [[250, 150, 1.0], [700, 176, .62], [1010, 128, .85], [1330, 196, .5], [1830, 205, .55], [80, 210, .42]].forEach(([x, y, s]) => cloud(x, y, s));
}
function cloud(x, y, s) {
  // cumulus: overlapping puffs, flat base, cool shading underneath
  const puffs = [[-120, -6, 38], [-70, -34, 52], [-10, -52, 66], [60, -36, 54], [118, -10, 40], [20, -12, 50], [-50, -8, 44]];
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.rect(-200, -160, 400, 160); g.clip();
  g.fillStyle = 'rgba(200,222,240,.9)'; g.beginPath(); puffs.forEach(([px, py, r]) => { g.moveTo(px + r, py + 6); g.arc(px, py + 6, r, 0, 7); }); g.fill();
  const cg = g.createLinearGradient(0, -120, 0, 0); cg.addColorStop(0, '#FFFFFF'); cg.addColorStop(.75, '#FAFDFF'); cg.addColorStop(1, '#E2EEF8');
  g.fillStyle = cg; g.beginPath(); puffs.forEach(([px, py, r]) => { g.moveTo(px + r, py); g.arc(px, py, r, 0, 7); }); g.fill();
  g.restore();
}
function ridge(y0, amp, seed, col0, col1, x0 = 0, x1 = W) {
  const r = rng(seed); g.beginPath(); g.moveTo(x0, HORIZON + 2);
  let a = r() * 6, b = r() * 6;
  for (let x = x0; x <= x1; x += 8) g.lineTo(x, y0 - amp * (.55 + .3 * Math.sin(x * .004 + a) + .15 * Math.sin(x * .013 + b)));
  g.lineTo(x1, HORIZON + 2); g.closePath(); g.fillStyle = lg(0, y0 - amp, 0, HORIZON, [[0, col0], [1, col1]]); g.fill();
}
function drawFarLand() {
  ridge(HORIZON - 6, 40, 3, '#A7C2D8', '#CFE0EC', 0, W);          // far mountains behind the steel works
  ridge(HORIZON, 26, 8, '#8FB49B', '#B6D2B4', 1050, W);
  g.fillStyle = '#B9D7A5'; g.fillRect(0, HORIZON, W, H - HORIZON);
}
const COAST = -14;
let SEA_TOP = HORIZON;
function drawSea() {
  g.save(); g.beginPath(); g.rect(-4000, SEA_TOP, 12000, 8000); g.clip();
  poly3([[COAST, -900], [COAST, 900], [-900, 900], [-900, -900]], lg(0, HORIZON, 0, 760, [[0, '#A9DDF3'], [.35, '#5DB4E2'], [1, '#2F8FCB']]));
  // wave glints
  const r = rng(12); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.4;
  for (let i = 0; i < 160; i++) {
    const x = COAST - 6 - r() * 260, y = -220 + r() * 520; const p = P(x, y, 0);
    if (p[1] < SEA_TOP + 4 || p[1] > H) continue;
    const L = 4 + r() * 10 * (p[1] - HORIZON) / 400; g.beginPath(); g.moveTo(p[0] - L, p[1]); g.lineTo(p[0] + L, p[1]); g.stroke();
  }
  // sun glitter path on the water
  const sg = g.createRadialGradient(1150, HORIZON + 30, 4, 1150, HORIZON + 30, 260);
  sg.addColorStop(0, 'rgba(255,250,220,.55)'); sg.addColorStop(1, 'rgba(255,250,220,0)'); g.fillStyle = sg; g.fillRect(700, HORIZON, 900, 300);
  // seawall + rocks along the coast
  poly3([[COAST, -260], [COAST + 5, -260], [COAST + 5, 260], [COAST, 260]], '#D9D2BE');
  poly3([[COAST - 3, -260], [COAST, -260], [COAST, 260], [COAST - 3, 260]], '#A99F88');
  const rr2 = rng(31);
  for (let y = -200; y < 240; y += 3.2) { const p = P(COAST - 2.5 - rr2() * 1.5, y, 0); g.fillStyle = rr2() > .5 ? '#BDB4A0' : '#9C937F'; g.beginPath(); g.arc(p[0], p[1], 1.6 + rr2() * 1.4, 0, 7); g.fill(); }
  ship(-74, 58, 40, 8, '#2F4F76'); ship(-44, 150, 18, 4.5, '#3E6A8F');
  g.restore();
}
function ship(x, y, L, Wd, c) {
  shBox(x, y, L, Wd, 0);
  box(x, y, -1.2, L, Wd, 3.2, c, { top: '#B44B3A' });
  box(x + L * .78, y + Wd * .15, 2, L * .14, Wd * .7, 6, '#F4F6F8');
  const cols = ['#C0392B', '#1BA39C', '#5B7FB5', '#E8772E', '#2E9E6A'];
  for (let i = 0; i < 7; i++) box(x + 3 + i * (L * .1), y + Wd * .12, 2, L * .085, Wd * .76, 2.4, cols[i % cols.length], { edge:false });
  // wake
  const p = P(x + L + 2, y + Wd / 2, 0); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(p[0] + 60, p[1] + 34); g.moveTo(p[0], p[1]); g.lineTo(p[0] + 70, p[1] + 18); g.stroke();
}
function road(pts, w = 7) {
  // asphalt ribbon with dashed centre line, pts in ground plane
  const sp = pts.map(p => P(p[0], p[1], 0));
  const st = (col, lw, dash) => { g.save(); if (dash) g.setLineDash(dash); g.beginPath(); sp.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = col; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(); g.restore(); };
  st('#5E6773', w * ISO.s * .82 + 2); st(PAL.asphalt, w * ISO.s * .82); st('rgba(255,255,255,.85)', 1.4, [10, 10]);
}
function drawGroundPlan() {
  // farmland patches beyond the site
  const r = rng(19); const fields = ['#C6DFB0', '#B2D59A', '#D2E5B6', '#A9CF92'];
  for (let i = 0; i < 26; i++) { const x = -10 + r() * 330, y = 150 + r() * 120, w = 18 + r() * 30, d = 14 + r() * 26; poly3([[x, y], [x + w, y], [x + w, y + d], [x, y + d]], fields[i % 4]); }
  for (let i = 0; i < 18; i++) { const x = 215 + r() * 120, y = -120 + r() * 260, w = 16 + r() * 30, d = 14 + r() * 26; poly3([[x, y], [x + w, y], [x + w, y + d], [x, y + d]], fields[(i + 1) % 4]); }
  // steel-works pad (behind)
  poly3([[96, -74], [222, -74], [222, -16], [96, -16]], '#D4D9DF');
  // plant site pad

/* ---- floating labels (screen space) ---- */
function tag(text, wx, wy, wz, col = PAL.pb, dy = -46, dx = 0) {
  const [x0, y] = P(wx, wy, wz), x = x0 + dx;
  g.save(); g.font = font(800, 26); const w = g.measureText(text).width + 34, h = 46;
  g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y); g.lineTo(x, y + dy + (dy < 0 ? h / 2 : -h / 2)); g.stroke();
  g.fillStyle = col; g.beginPath(); g.arc(x0, y, 4, 0, 7); g.fill();
  g.shadowColor = 'rgba(0,40,90,.25)'; g.shadowBlur = 14; g.fillStyle = 'rgba(255,255,255,.96)';
  const bx = x - w / 2, by = y + dy - h / 2; g.beginPath(); g.roundRect(bx, by, w, h, 10); g.fill(); g.shadowBlur = 0;
  g.lineWidth = 2.5; g.stroke(); g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x, by + h / 2 + 1);
  g.restore();
}

/* ============================================================
   RENDER
   ============================================================ */
const cv = document.getElementById('cv');
function render() {
  DPR = Math.max(1, window.devicePixelRatio || 1);
  const sc = Math.min(innerWidth / W, innerHeight / H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W * sc + 'px'; cv.style.height = H * sc + 'px';
  cv.style.left = (innerWidth - W * sc) / 2 + 'px'; cv.style.top = (innerHeight - H * sc) / 2 + 'px';
  g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(); drawFarLand();
  g.save(); g.beginPath(); g.rect(0, HORIZON, W, H); g.clip();     // ground plane never rises above the horizon
  drawSea(); drawGroundPlan(); solarField(); drawShadows();
  g.restore();
  drawSolar();
  OBJ.sort((a, b) => a.depth - b.depth).forEach(o => o.f());
  tag('HyREX 수소환원제철', 171, -51, 60, PAL.pb, -40);
  tag('POSCO 청록수소 플랜트 · 2030', 60, 124, 2, PAL.tq, 150, -230);
  // gentle atmospheric haze toward the horizon
  g.fillStyle = lg(0, HORIZON, 0, HORIZON + 160, [[0, 'rgba(230,244,252,.55)'], [1, 'rgba(230,244,252,0)']]); g.fillRect(0, HORIZON, W, 160);
  window.__ready = true;
}
addEventListener('resize', render);
render();
